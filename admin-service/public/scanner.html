<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="UpForIt SCANNER"><link rel="manifest" href="/scanner.webmanifest"><link rel="apple-touch-icon" href="/assets/scanner-icon-180.png"><link rel="icon" href="/assets/scanner-icon-192.png"><meta name="robots" content="noindex,nofollow"><title>UpForIt SCANNER</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/scanner.css"></head>
<body><main class="scanner-shell">
<header><div class="brand"><img class="logo" src="/assets/logo.png" alt="UpForIt"><span>SCANNER</span></div><details id="settings"><summary aria-label="Scanner settings">•••</summary><div class="settings-panel"><p id="identity">Checking access…</p><div id="settings-content"></div></div></details></header>
<section id="access" hidden><p>Door staff: ask for a scanner access QR. Administrators can sign in below.</p><form id="login" class="scanner-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary">Sign in</button></form></section>
<section id="activation" hidden><h2>Activate this scanner</h2><form id="activate" class="scanner-form"><label>Device label (optional)<input name="label" maxlength="60" placeholder="Front door iPhone"></label><button class="button primary">Start scanning</button></form></section>
<section id="scanner" hidden>
<div class="viewfinder"><video id="video" muted playsinline autoplay aria-label="Ticket scanning camera"></video><div class="scan-guide" aria-hidden="true"></div><button id="camera" class="camera-button" type="button">Start camera</button><span id="scan-state" role="status">Ready to scan</span></div>
<p id="ticket-number" aria-live="polite">—</p>
<details class="manual-entry"><summary>Enter ticket number</summary><form id="manual" class="scanner-form"><label class="sr-only" for="ticket-code">Ticket number</label><input id="ticket-code" name="code" placeholder="UFI-T-010001" autocomplete="off" required maxlength="200"><button class="button" type="submit">Check in</button></form></details>
<button id="end-access" class="button ghost" type="button" hidden>End scanner access</button></section>
<div id="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden><div class="result-content"><svg class="result-symbol" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52"/><path class="tick" d="M32 61 L51 80 L88 41"/><path class="cross" d="M40 40 L80 80 M80 40 L40 80"/></svg><strong id="result-title"></strong><p id="result-detail"></p><button id="retry" class="button" type="button" hidden>Confirm scan</button><button id="dismiss" class="button" type="button">Scan next ticket</button></div></div>
<section id="management" hidden><h2>Scanner devices</h2><button id="enrol" class="button" type="button">Show scanner access QR</button><div id="enrolment" hidden><img id="enrol-qr" width="300" height="300" alt="Scanner access QR"><p id="enrol-description"></p><button id="close-enrolment" class="button ghost" type="button">Close access QR</button></div><div id="devices"></div></section>
</main><script src="/vendor/zxing-browser.min.js" defer></script><script src="/scanner.js" defer></script></body></html>
